name: Build FlyWire Minecraft mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', 'gradle.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # This is deliberately a real data build. If the public export changes or is
      # unavailable the job fails instead of packaging a fabricated brain.
      - name: Download FlyWire FAFB v783 inputs
        run: python tools/download_flywire.py

      - name: Verify raw checksums
        run: python tools/verify_checksums.py

      - name: Inspect the raw FlyWire tables
        run: |
          mkdir -p build/diagnostics
          set -o pipefail
          python tools/inspect_dataset.py 2>&1 | tee build/diagnostics/inspect.log

      - name: Upload inspection diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flywire-inspection-diagnostics
          path: build/diagnostics/inspect.log
          if-no-files-found: warn

      - name: Preprocess the real connectome
        run: python tools/build_connectome.py

      - name: Validate the generated sparse representation
        run: python tools/validate_processed.py

      - name: Unit tests
        id: unit_tests
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p build/diagnostics
          ./gradlew test --stacktrace 2>&1 | tee build/diagnostics/test.log

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flywire-test-diagnostics
          path: |
            build/diagnostics/test.log
            build/reports/tests/
          if-no-files-found: warn

      - name: Fail if unit tests failed
        if: steps.unit_tests.outcome == 'failure'
        run: exit 1

      - name: Build jar with verified FlyWire data
        run: ./gradlew build -PrequireFlyWireData

      - name: Verify produced mod jar
        shell: bash
        run: |
          set -euo pipefail
          jars=(build/libs/*.jar)
          test "${#jars[@]}" -gt 0
          unzip -l "${jars[0]}" | grep -q 'data/flywire/brain/flywire-v783.bin'
          unzip -l "${jars[0]}" | grep -q 'fabric.mod.json'

      - name: Upload runnable mod jar
        uses: actions/upload-artifact@v4
        with:
          name: flywire-minecraft-mod
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload build metadata and debug sources
        uses: actions/upload-artifact@v4
        with:
          name: flywire-build-metadata
          path: |
            data/flywire/raw/download-manifest.json
            data/flywire/processed/flywire-v783.metadata.json
            build/reports/tests/
          if-no-files-found: warn
          retention-days: 30
