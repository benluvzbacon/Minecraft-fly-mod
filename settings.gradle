pluginManagement {
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
}

// Fabric Loom adds its remapped Minecraft repositories during plugin application.
// Keeping dependency repositories in build.gradle avoids Gradle's settings-level
// repository lock rejecting those Loom repositories.
rootProject.name = 'flywire-minecraft-mod'
